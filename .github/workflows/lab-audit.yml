name: Lab audit tests

on:
  push:
    branches: [main, 'integration/main-audit-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test ancestry and file ownership gate
        run: python3 -m unittest discover -s Tools/tests -p 'test_IBAudit*.py' -v
